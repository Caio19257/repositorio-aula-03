<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>pagina web</h1>
    <p>Exemplo utilizando as tags de imagem, link de videos e página</p>
    <h2>Tênis de corrida</h2>
    <!--usando imagem-->
    <img
        src="250995-12000-12000.webp"
        width="250"
        alt="Tênis de corrida">
        <p>
            Este é um exemplo de imagem inserida em uma pagina html.
        </p>
        <br>
        <!--utilizando link para um site externo-->
        <a
            href="https://www.google.com/"
            class="cardbutton"
            target="_blank"
            rel="noopener noreferrer">
        </a>
        <br>
        <!--liminando outra pagina html-->
        <a 
        href="segundapagina.html"
        class="aluno-link">
        link para outra pagina html => já sou aluno!
    </a>
        

</body>
</html>
